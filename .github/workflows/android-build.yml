name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean and Initialize Tauri Android
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Copy Android Icons
        run: |
          RES="src-tauri/gen/android/app/src/main/res"
          cp src-tauri/icons/android/mipmap-mdpi.png "$RES/mipmap-mdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-hdpi.png "$RES/mipmap-hdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xhdpi.png "$RES/mipmap-xhdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xxhdpi.png "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xxxhdpi.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xxxhdpi.png "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          echo "Android icons replaced successfully"

      - name: Patch Android Permissions
        run: python3 scripts/patch-android-permissions.py src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Patch Android Fullscreen/Immersive Mode
        run: python3 scripts/patch-android-fullscreen.py src-tauri/gen/android

      - name: Set Android Version Info
        run: |
          echo "tauri.android.versionCode=1" > src-tauri/gen/android/app/tauri.properties
          echo "tauri.android.versionName=0.2.0" >> src-tauri/gen/android/app/tauri.properties

      - name: Generate Keystore and Patch Signing
        run: |
          keytool -genkeypair -v -keystore src-tauri/gen/android/app/otpvault.keystore -alias otpvault -keyalg RSA -keysize 2048 -validity 10000 -storepass otpvault123 -keypass otpvault123 -dname "CN=OtpVault, OU=Dev, O=OtpVault, L=Unknown, ST=Unknown, C=US"
          python3 scripts/patch-signing.py src-tauri/gen/android/app/build.gradle.kts

      - name: Show Patched build.gradle.kts
        run: cat src-tauri/gen/android/app/build.gradle.kts

      - name: Build Release APK
        run: npx tauri android build --target aarch64 --target armv7

      - name: Find APK Files
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find src-tauri/gen/android -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== Searching for AAB files ==="
          find src-tauri/gen/android -name "*.aab" -type f -exec ls -lh {} \;
          echo "=== All build outputs ==="
          find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null || echo "No outputs directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OtpVault-APK
          path: src-tauri/gen/android/**/*.apk
          if-no-files-found: error
