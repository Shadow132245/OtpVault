name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean and Initialize Tauri Android
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Set Android Version Info
        run: |
          echo "tauri.android.versionCode=1" > src-tauri/gen/android/app/tauri.properties
          echo "tauri.android.versionName=0.1.6" >> src-tauri/gen/android/app/tauri.properties

      - name: Build Debug APK
        run: npx tauri android build --debug

      - name: List Build Outputs
        if: always()
        run: find src-tauri/gen/android -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OtpVault-APK
          path: src-tauri/gen/android/**/*.apk
          if-no-files-found: warn
