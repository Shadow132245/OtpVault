name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clean and Initialize Tauri Android
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Set Android Version Info
        run: |
          echo "tauri.android.versionCode=1" > src-tauri/gen/android/app/tauri.properties
          echo "tauri.android.versionName=0.1.6" >> src-tauri/gen/android/app/tauri.properties

      - name: Generate Keystore and Sign APK
        run: |
          keytool -genkeypair -v -keystore src-tauri/gen/android/app/otpvault.keystore -alias otpvault -keyalg RSA -keysize 2048 -validity 10000 -storepass otpvault123 -keypass otpvault123 -dname "CN=OtpVault, OU=Dev, O=EuroMoscow, L=Unknown, ST=Unknown, C=US"

          python3 << 'PYEOF'
          import re

          with open("src-tauri/gen/android/app/build.gradle.kts", "r") as f:
              content = f.read()

          signing_block = '''    signingConfigs {
        create("release") {
            storeFile = file("otpvault.keystore")
            storePassword = "otpvault123"
            keyAlias = "otpvault"
            keyPassword = "otpvault123"
        }
    }
'''
          content = content.replace("    buildTypes {", signing_block + "    buildTypes {")

          content = content.replace(
              'getByName("release") {\n            isMinifyEnabled',
              'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled'
          )

          with open("src-tauri/gen/android/app/build.gradle.kts", "w") as f:
              f.write(content)

          print("Patched build.gradle.kts with signing config")
          PYEOF

      - name: Build Tauri Android APK
        run: npx tauri android build

      - name: Find APK
        run: |
          echo "=== Looking for APK files ==="
          find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Build outputs ==="
          find src-tauri/gen/android/app/build/outputs -type f 2>/dev/null || echo "No outputs"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OtpVault-APK
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
