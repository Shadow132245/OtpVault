name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            rust-target: x86_64-pc-windows-msvc
          - arch: x86
            rust-target: i686-pc-windows-msvc

    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust targets
        run: |
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Get version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag -replace '^v', ''
          echo "VERSION=$v" >> $env:GITHUB_ENV
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content package.json) -replace '"version": ".*"', "`"version`": `"$v`"" | Set-Content package.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.android.conf.json) -replace '"version": ".*"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.android.conf.json
          (Get-Content landing/version.json) -replace '"version": ".*"', "`"version`": `"$v`"" | Set-Content landing/version.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri (${{ matrix.arch }})
        run: |
          $env:DATABASE_URL = "${{ secrets.DATABASE_URL }}"
          npx tauri build --bundles msi --target ${{ matrix.rust-target }}

      - name: Copy MSI to project root
        run: |
          $msi = Get-ChildItem -Path "src-tauri\target" -Filter "OtpVault_${env:VERSION}_${{ matrix.arch }}_en-US.msi" -Recurse -ErrorAction Stop | Select-Object -First 1
          Copy-Item -Path $msi.FullName -Destination "OtpVault_${env:VERSION}_${{ matrix.arch }}_en-US.msi" -Force

      - name: Brand MSI
        run: pwsh -File scripts\brand-msi.ps1 -MsiPath "OtpVault_${env:VERSION}_${{ matrix.arch }}_en-US.msi"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OtpVault_${{ env.VERSION }}_${{ matrix.arch }}_en-US.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Accept Android SDK Licenses
        run: |
          SDK="$ANDROID_HOME"
          for TOOLS_DIR in "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools/16.0" "$SDK/cmdline-tools"; do
            if [ -x "$TOOLS_DIR/bin/sdkmanager" ]; then
              echo "Accepting licenses via $TOOLS_DIR/bin/sdkmanager"
              yes | "$TOOLS_DIR/bin/sdkmanager" --licenses || true
            fi
          done
          ls "$SDK/licenses" 2>/dev/null || echo "no licenses dir"

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> $GITHUB_ENV
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" src-tauri/tauri.android.conf.json
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$VERSION\"|" landing/version.json

      - name: Clean and Initialize Tauri Android
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init

      - name: Copy Android Icons
        run: |
          RES="src-tauri/gen/android/app/src/main/res"
          cp src-tauri/icons/android/mipmap-mdpi.png "$RES/mipmap-mdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-hdpi.png "$RES/mipmap-hdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xhdpi.png "$RES/mipmap-xhdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xxhdpi.png "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xxxhdpi.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cp src-tauri/icons/android/mipmap-xxxhdpi.png "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

      - name: Patch Android Permissions
        run: python3 scripts/patch-android-permissions.py src-tauri/gen/android/app/src/main/AndroidManifest.xml src-tauri/gen/android/app/src/main/java/com/otpvault/desktop/MainActivity.kt

      - name: Patch Android Biometric Prompt
        run: python3 scripts/patch-android-biometric.py src-tauri/gen/android

      - name: Patch Android Updater
        run: python3 scripts/patch-android-updater.py src-tauri/gen/android

      - name: Patch Android Fullscreen/Immersive Mode
        run: python3 scripts/patch-android-fullscreen.py src-tauri/gen/android

      - name: Set Android Version Info
        run: |
          echo "tauri.android.versionCode=${{ env.VERSION_CODE }}" > src-tauri/gen/android/app/tauri.properties
          echo "tauri.android.versionName=${{ env.VERSION }}" >> src-tauri/gen/android/app/tauri.properties

      - name: Generate Keystore and Patch Signing
        run: |
          keytool -genkeypair -v -keystore src-tauri/gen/android/app/otpvault.keystore -alias otpvault -keyalg RSA -keysize 2048 -validity 10000 -storepass otpvault123 -keypass otpvault123 -dname "CN=OtpVault, OU=Dev, O=OtpVault, L=Unknown, ST=Unknown, C=US"
          python3 scripts/patch-signing.py src-tauri/gen/android/app/build.gradle.kts

      - name: Build Release APKs
        run: npx tauri android build --target aarch64 --target armv7

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/gen/android/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-back:
    needs: [build, android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Bump repository version files to match the tag
        run: node scripts/bump-version.cjs "$VERSION"

      - name: Commit and push the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/tauri.android.conf.json src-tauri/Cargo.toml landing/version.json
          if git diff --cached --quiet; then
            echo "Version files already up to date - no commit needed"
            exit 0
          fi
          git commit -m "chore(release): bump version to $VERSION [skip ci]"
          git push origin main
